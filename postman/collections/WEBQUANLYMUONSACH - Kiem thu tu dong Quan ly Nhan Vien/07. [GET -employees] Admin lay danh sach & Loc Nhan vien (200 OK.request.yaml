$kind: http-request
name: 07. [GET /employees] Admin lay danh sach & Loc Nhan vien (200 OK)
url: "{{baseUrl}}/employees?trangThaiLamViec=DANG_LAM_VIEC&page=1&limit=10"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
queryParams:
  trangThaiLamViec: DANG_LAM_VIEC
  page: "1"
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code la 200 OK', function () {
          pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      pm.test('Tra ve danhSach nhan vien kem taiKhoanId populate va phanTrang', function () {
          pm.expect(json.success).to.be.true;
          pm.expect(json.data.danhSach).to.be.an('array');
          pm.expect(json.data.phanTrang).to.be.an('object');
          pm.expect(json.data.danhSach.length).to.be.above(0);
      });
    language: text/javascript
order: 7000
