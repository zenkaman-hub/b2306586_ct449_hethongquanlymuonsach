$kind: http-request
name: 23. [DELETE /employees/:adminId] Admin thu tu xoa chinh minh (400 KHONG_THE_TU_XOA_CHINH_MINH)
url: "{{baseUrl}}/employees/{{adminNhanVienId}}"
method: DELETE
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code la 400 Bad Request', function () {
          pm.response.to.have.status(400);
      });
      const json = pm.response.json();
      pm.test('Chan Admin tu xoa chinh minh voi ma loi KHONG_THE_TU_XOA_CHINH_MINH', function () {
          pm.expect(json.success).to.be.false;
          pm.expect(json.errorCode).to.eql('KHONG_THE_TU_XOA_CHINH_MINH');
      });
    language: text/javascript
order: 23000
