$kind: http-request
name: 25. [GET /employees/:id] Kiem tra Nhan vien da bi xoa khoi CSDL (404 KHONG_TIM_THAY_NHAN_VIEN)
url: "{{baseUrl}}/employees/{{createdNhanVienId}}"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code la 404 Not Found', function () {
          pm.response.to.have.status(404);
      });
      const json = pm.response.json();
      pm.test('Tra ve ma loi KHONG_TIM_THAY_NHAN_VIEN sau khi xoa', function () {
          pm.expect(json.success).to.be.false;
          pm.expect(json.errorCode).to.eql('KHONG_TIM_THAY_NHAN_VIEN');
      });
    language: text/javascript
order: 25000
