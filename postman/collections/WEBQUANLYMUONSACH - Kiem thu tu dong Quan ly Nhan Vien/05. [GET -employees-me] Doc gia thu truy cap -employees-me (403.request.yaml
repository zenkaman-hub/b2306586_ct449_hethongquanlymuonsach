$kind: http-request
name: 05. [GET /employees/me] Doc gia thu truy cap /employees/me (403 KHONG_DU_QUYEN)
url: "{{baseUrl}}/employees/me"
method: GET
headers:
  Authorization: Bearer {{readerToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code la 403 Forbidden', function () {
          pm.response.to.have.status(403);
      });
      const json = pm.response.json();
      pm.test('Chan DOC_GIA truy cap endpoint nhan vien', function () {
          pm.expect(json.success).to.be.false;
          pm.expect(json.errorCode).to.eql('KHONG_DU_QUYEN');
      });
    language: text/javascript
order: 5000
