$kind: http-request
url: "{{baseUrl}}/publishers/{{createdNxbId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code la 404 Not Found', function () {
          pm.response.to.have.status(404);
      });
      const json = pm.response.json();
      pm.test('Tra ve ma loi KHONG_TIM_THAY_NXB sau khi xoa', function () {
          pm.expect(json.success).to.be.false;
          pm.expect(json.errorCode).to.eql('KHONG_TIM_THAY_NXB');
      });
    language: text/javascript
order: 12000
