$kind: http-request
url: "{{baseUrl}}/publishers/{{createdNxbId}}"
method: PUT
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "tenNXB": "{{tenNxbTest}} - Updated",
      "diaChi": "Khu II, Dai hoc Can Tho (Da cap nhat)"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code la 200 OK', function () {
          pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      pm.test('Cap nhat diaChi va tenNXB thanh cong', function () {
          pm.expect(json.success).to.be.true;
          pm.expect(json.data.diaChi).to.eql('Khu II, Dai hoc Can Tho (Da cap nhat)');
      });
    language: text/javascript
order: 8000
