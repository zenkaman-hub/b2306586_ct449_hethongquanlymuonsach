$kind: http-request
url: "{{baseUrl}}/publishers/{{createdNxbId}}"
method: DELETE
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code la 200 OK', function () {
          pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      pm.test('Xoa vat ly NXB chua co sach thanh cong', function () {
          pm.expect(json.success).to.be.true;
          pm.expect(json.data._id).to.eql(pm.collectionVariables.get('createdNxbId'));
      });
    language: text/javascript
order: 11000
