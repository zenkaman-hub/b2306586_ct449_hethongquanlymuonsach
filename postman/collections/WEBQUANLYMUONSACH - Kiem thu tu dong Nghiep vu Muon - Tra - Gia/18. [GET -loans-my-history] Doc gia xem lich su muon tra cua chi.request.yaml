$kind: http-request
name: 18. [GET /loans/my-history] Doc gia xem lich su muon tra cua chinh minh (200 OK - BR-02)
url: "{{baseUrl}}/loans/my-history"
method: GET
headers:
  Authorization: Bearer {{testReaderToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code la 200 OK', function () {
          pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      pm.test('Doc gia xem duoc danh sach phieu muon cua minh', function () {
          pm.expect(json.success).to.be.true;
          pm.expect(json.data.danhSach.length).to.be.above(0);
      });
    language: text/javascript
order: 18000
