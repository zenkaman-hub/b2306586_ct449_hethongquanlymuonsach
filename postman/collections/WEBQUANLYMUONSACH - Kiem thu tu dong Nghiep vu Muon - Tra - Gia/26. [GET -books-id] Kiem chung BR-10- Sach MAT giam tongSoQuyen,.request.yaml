$kind: http-request
name: "26. [GET /books/:id] Kiem chung BR-10: Sach MAT giam tongSoQuyen, tang soQuyenDaMat, KHONG tang soQuyenKhaDung"
url: "{{baseUrl}}/books/{{sach3Id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code la 200 OK', function () {
          pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      pm.test('Ton kho Sach 3 sau khi MAT: tongSoQuyen=2, soQuyenDangMuon=0, soQuyenKhaDung=2, soQuyenDaMat=1 (BR-10)', function () {
          pm.expect(json.success).to.be.true;
          pm.expect(json.data.tongSoQuyen).to.eql(2);
          pm.expect(json.data.soQuyenDangMuon).to.eql(0);
          pm.expect(json.data.soQuyenKhaDung).to.eql(2);
          pm.expect(json.data.soQuyenDaMat).to.eql(1);
      });
    language: text/javascript
order: 26000
