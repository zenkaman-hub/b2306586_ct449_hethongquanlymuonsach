$kind: http-request
name: 07. [POST /books] Tao Sach Test 2 (De test Gia han & Tra sach Hu hong nang)
url: "{{baseUrl}}/books"
method: POST
headers:
  Authorization: Bearer {{librarianToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "tenSach": "Sach Test Muon Tra 02 - {{$timestamp}}",
      "donGia": 120000,
      "tongSoQuyen": 3,
      "namXuatBan": 2024,
      "nhaXuatBanId": "{{activeNxbId}}",
      "nguonGocTacGia": "Tac Gia 02"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Tao Sach Test 2 thanh cong (201 Created, donGia=120000)', function () {
          pm.response.to.have.status(201);
      });
      const json = pm.response.json();
      if (json.data && json.data._id) {
          pm.collectionVariables.set('sach2Id', json.data._id);
      }
    language: text/javascript
order: 7000
