$kind: http-request
name: 16. [POST /fines/:id/pay] Doc gia thu tu xac nhan thu tien phat (403 KHONG_DU_QUYEN - BR-13)
url: "{{baseUrl}}/fines/{{kp2Id}}/pay"
method: POST
headers:
  Authorization: Bearer {{testReaderToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "soTienThu": 100000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code la 403 Forbidden', function () {
          pm.response.to.have.status(403);
      });
      const json = pm.response.json();
      pm.test('Chan DOC_GIA tu xac nhan thanh toan phat', function () {
          pm.expect(json.success).to.be.false;
          pm.expect(json.errorCode).to.eql('KHONG_DU_QUYEN');
      });
    language: text/javascript
order: 16000
