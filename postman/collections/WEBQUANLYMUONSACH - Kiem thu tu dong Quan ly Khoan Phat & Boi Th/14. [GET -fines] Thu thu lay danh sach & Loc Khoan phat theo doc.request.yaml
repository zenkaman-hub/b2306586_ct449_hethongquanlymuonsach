$kind: http-request
name: 14. [GET /fines] Thu thu lay danh sach & Loc Khoan phat theo docGiaId (200 OK)
url: "{{baseUrl}}/fines?docGiaId={{testDocGiaId}}&trangThai=CHUA_THANH_TOAN"
method: GET
headers:
  Authorization: Bearer {{librarianToken}}
queryParams:
  docGiaId: "{{testDocGiaId}}"
  trangThai: CHUA_THANH_TOAN
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code la 200 OK', function () {
          pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      pm.test('Tra ve 3 khoan phat CHUA_THANH_TOAN cua testDocGia', function () {
          pm.expect(json.success).to.be.true;
          pm.expect(json.data.danhSach.length).to.eql(3);
      });
    language: text/javascript
order: 14000
