name: 22. [PATCH /fines/:id/cancel] Huy Khoan phat 1 nhung thieu ghiChuXuLy (400 DU_LIEU_KHONG_HOP_LE - BR-12)
url: "{{baseUrl}}/fines/{{kp1Id}}/cancel"
method: PATCH
headers:
  Authorization: Bearer {{librarianToken}}
  Content-Type: application/json
body:
  type: text
  content: "{}"
scripts:
