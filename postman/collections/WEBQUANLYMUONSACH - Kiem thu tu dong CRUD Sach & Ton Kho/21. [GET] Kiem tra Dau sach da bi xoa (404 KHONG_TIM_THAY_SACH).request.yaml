$kind: http-request
url: "{{baseUrl}}/books/{{createdSachId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code la 404 Not Found', function () {
          pm.response.to.have.status(404);
      });
      const json = pm.response.json();
      pm.test('Xac nhan sach da bi xoa khoi CSDL (KHONG_TIM_THAY_SACH)', function () {
          pm.expect(json.success).to.be.false;
          pm.expect(json.errorCode).to.eql('KHONG_TIM_THAY_SACH');
      });
    language: text/javascript
order: 21000
