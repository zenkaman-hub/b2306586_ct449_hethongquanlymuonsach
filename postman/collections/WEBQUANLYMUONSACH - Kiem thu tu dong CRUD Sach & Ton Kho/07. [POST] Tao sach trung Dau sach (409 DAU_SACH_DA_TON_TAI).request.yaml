$kind: http-request
url: "{{baseUrl}}/books"
method: POST
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "tenSach": "{{tenSachTest}}",
      "donGia": 125000,
      "tongSoQuyen": 5,
      "namXuatBan": 2024,
      "nhaXuatBanId": "{{activeNxbId}}",
      "nguonGocTacGia": "tran van kiem thu"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code la 409 Conflict', function () {
          pm.response.to.have.status(409);
      });
      const json = pm.response.json();
      pm.test('Chan trung lap dau sach voi ma loi DAU_SACH_DA_TON_TAI', function () {
          pm.expect(json.success).to.be.false;
          pm.expect(json.errorCode).to.eql('DAU_SACH_DA_TON_TAI');
      });
    language: text/javascript
order: 7000
