$kind: http-request
name: 24. [DELETE /readers/:id] Xoa vat ly Doc gia moi tao chua co giao dich (200 OK)
url: "{{baseUrl}}/readers/{{createdDocGiaId}}"
method: DELETE
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code la 200 OK', function () {
          pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      pm.test('Xoa dong thoi doc_gia va tai_khoan thanh cong', function () {
          pm.expect(json.success).to.be.true;
          pm.expect(json.data._id).to.eql(pm.collectionVariables.get('createdDocGiaId'));
      });
    language: text/javascript
order: 24000
