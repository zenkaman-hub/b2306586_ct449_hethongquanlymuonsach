$kind: http-request
name: 12. [POST /readers] Tao Doc gia trung dienThoai (409 DIEN_THOAI_DA_TON_TAI)
url: "{{baseUrl}}/readers"
method: POST
headers:
  Authorization: Bearer {{librarianToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "tenDangNhap": "user_khac_{{$timestamp}}",
      "matKhau": "DocGia@123",
      "hoLot": "Nguyen",
      "ten": "Trung SDT",
      "dienThoai": "{{createdDienThoai}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code la 409 Conflict', function () {
          pm.response.to.have.status(409);
      });
      const json = pm.response.json();
      pm.test('Chan trung dienThoai voi ma loi DIEN_THOAI_DA_TON_TAI', function () {
          pm.expect(json.success).to.be.false;
          pm.expect(json.errorCode).to.eql('DIEN_THOAI_DA_TON_TAI');
      });
    language: text/javascript
order: 12000
