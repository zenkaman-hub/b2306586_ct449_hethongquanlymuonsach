$kind: http-request
name: 25. [GET /readers/:id] Kiem tra Doc gia da bi xoa khoi CSDL (404 KHONG_TIM_THAY_DOC_GIA)
url: "{{baseUrl}}/readers/{{createdDocGiaId}}"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code la 404 Not Found', function () {
          pm.response.to.have.status(404);
      });
      const json = pm.response.json();
      pm.test('Tra ve ma loi KHONG_TIM_THAY_DOC_GIA', function () {
          pm.expect(json.success).to.be.false;
          pm.expect(json.errorCode).to.eql('KHONG_TIM_THAY_DOC_GIA');
      });
    language: text/javascript
order: 25000
