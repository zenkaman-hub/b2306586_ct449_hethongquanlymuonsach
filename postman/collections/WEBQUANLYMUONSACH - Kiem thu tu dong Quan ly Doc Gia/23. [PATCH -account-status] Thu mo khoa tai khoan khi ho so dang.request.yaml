$kind: http-request
name: 23. [PATCH /account-status] Thu mo khoa tai khoan khi ho so dang NGUNG_HOAT_DONG (409)
url: "{{baseUrl}}/readers/{{createdDocGiaId}}/account-status"
method: PATCH
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "trangThai": "HOAT_DONG"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code la 409 Conflict', function () {
          pm.response.to.have.status(409);
      });
      const json = pm.response.json();
      pm.test('Chan mo khoa tai khoan khi ho so NGUNG_HOAT_DONG (HO_SO_DOC_GIA_NGUNG_HOAT_DONG)', function () {
          pm.expect(json.success).to.be.false;
          pm.expect(json.errorCode).to.eql('HO_SO_DOC_GIA_NGUNG_HOAT_DONG');
      });
    language: text/javascript
order: 23000
